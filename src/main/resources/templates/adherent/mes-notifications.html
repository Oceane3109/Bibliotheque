<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mes notifications</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/sidebar-theme.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
</head>
<body class="d-flex">
    <div th:replace="~{shared/sidebar :: sidebar-adherent}"></div>
    <main class="flex-fill p-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1><i class="bi bi-bell"></i> Mes notifications</h1>
        <a th:href="@{/adherent/dashboard}" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> Retour au dashboard
        </a>
    </div>
    
    <div class="container mt-4">
        
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">Notifications reçues</h5>
            </div>
            <div class="card-body">
                <div th:if="${#lists.isEmpty(notifications)}" class="alert alert-info">
                    <i class="bi bi-info-circle"></i> Aucune notification reçue pour le moment.
                </div>

                <div th:if="${!#lists.isEmpty(notifications)}">
                    <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
                        <span class="text-muted small">Afficher :</span>
                        <select id="notifPageSize" class="form-select form-select-sm w-auto">
                            <option value="5">5</option>
                            <option value="10" selected>10</option>
                            <option value="20">20</option>
                            <option value="9999">Tout</option>
                        </select>
                        <button id="notifMore" class="btn btn-sm btn-outline-primary" type="button">Afficher plus</button>
                        <button id="notifLess" class="btn btn-sm btn-outline-secondary" type="button">Afficher moins</button>
                        <span id="notifCount" class="ms-auto text-muted small"></span>
                    </div>
                    <div class="list-group" id="notifList">
                    <div th:each="notification, stat : ${notifications}" 
                         th:attr="data-index=${stat.index}"
                         th:class="${'list-group-item list-group-item-action ' + (notification.lue ? 'list-group-item-secondary' : 'list-group-item-primary')}">
                        <div class="d-flex w-100 justify-content-between">
                            <h6 class="mb-1" th:text="${notification.titre}">Titre</h6>
                            <small th:text="${#temporals.format(notification.dateEnvoi, 'dd/MM/yyyy HH:mm')}">Date</small>
                        </div>
                        <p class="mb-1" th:text="${notification.message}">Message</p>
                        <div class="d-flex justify-content-between align-items-center">
                            <small>
                                <span th:if="${notification.lu}" class="badge bg-secondary">Lue</span>
                                <span th:unless="${notification.lu}" class="badge bg-primary">Non lue</span>
                            </small>
                            <form th:if="${!notification.lu}" 
                                  th:action="@{/notification/lue/{id}(id=${notification.idNotification})}" 
                                  method="post" 
                                  style="display: inline;">
                                <button type="submit" class="btn btn-sm btn-outline-success">
                                    <i class="bi bi-check-circle"></i> Marquer comme lue
                                </button>
                            </form>
                        </div>
                    </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (function() {
            const list = document.getElementById('notifList');
            if (!list) return;
            const items = Array.from(list.children);
            const pageSize = document.getElementById('notifPageSize');
            const moreBtn = document.getElementById('notifMore');
            const lessBtn = document.getElementById('notifLess');
            const count = document.getElementById('notifCount');

            let visible = parseInt(pageSize.value, 10);

            function render() {
                const total = items.length;
                const maxVisible = Math.min(visible, total);
                items.forEach((item, idx) => {
                    item.style.display = idx < maxVisible ? '' : 'none';
                });
                count.textContent = `${maxVisible} / ${total}`;
                moreBtn.disabled = maxVisible >= total;
                lessBtn.disabled = maxVisible <= Math.min(5, total);
            }

            pageSize.addEventListener('change', () => {
                visible = parseInt(pageSize.value, 10);
                render();
            });

            moreBtn.addEventListener('click', () => {
                visible = Math.min(items.length, visible + 5);
                pageSize.value = '9999';
                render();
            });

            lessBtn.addEventListener('click', () => {
                visible = Math.max(5, visible - 5);
                if (visible < 9999) {
                    pageSize.value = String(visible);
                }
                render();
            });

            render();
        })();
    </script>
    </main>
</body>
</html>
