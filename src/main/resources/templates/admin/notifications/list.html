<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Liste des notifications - Administration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/sidebar-theme.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
</head>
<body class="d-flex">
    <div th:replace="~{shared/sidebar :: sidebar-admin}"></div>
    <main class="flex-fill p-4">

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="d-inline"><i class="bi bi-bell"></i> Liste des notifications</h1>
            </div>
            <a href="/admin/notifications/create" class="btn btn-primary">
                <i class="bi bi-plus-circle"></i> Créer une notification
            </a>
        </div>
        
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">Notifications enregistrées</h5>
            </div>
            <div class="card-body">
                <div th:if="${#lists.isEmpty(notifications)}" class="alert alert-info">
                    <i class="bi bi-info-circle"></i> Aucune notification enregistrée pour le moment.
                </div>

                <div th:if="${!#lists.isEmpty(notifications)}">
                    <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
                        <span class="text-muted small">Afficher :</span>
                        <select id="adminNotifPageSize" class="form-select form-select-sm w-auto">
                            <option value="5">5</option>
                            <option value="10" selected>10</option>
                            <option value="20">20</option>
                            <option value="9999">Tout</option>
                        </select>
                        <div class="input-group input-group-sm w-auto">
                            <span class="input-group-text"><i class="bi bi-funnel"></i></span>
                            <input id="adminNotifFilter" type="text" class="form-control" placeholder="Filtrer (adhérent, titre, message)">
                        </div>
                        <select id="adminNotifEtat" class="form-select form-select-sm w-auto">
                            <option value="all" selected>Tout</option>
                            <option value="lu">Lue</option>
                            <option value="non_lue">Non lue</option>
                        </select>
                        <button id="adminNotifMore" class="btn btn-sm btn-outline-primary" type="button">Afficher plus</button>
                        <button id="adminNotifLess" class="btn btn-sm btn-outline-secondary" type="button">Afficher moins</button>
                        <span id="adminNotifCount" class="ms-auto text-muted small"></span>
                    </div>
                    <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>Adhérent</th>
                                <th>Titre</th>
                                <th>Message</th>
                                <th>Date</th>
                                <th>État</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="adminNotifBody">
                            <tr th:each="notification, stat : ${notifications}"
                                th:attr="data-index=${stat.index},
                                         data-lu=${notification.lu},
                                         data-adherent=${notification.adherent.nom + ' ' + notification.adherent.prenom},
                                         data-titre=${notification.titre},
                                         data-message=${notification.message}">
                                <td th:text="${notification.adherent.nom + ' ' + notification.adherent.prenom}">Adhérent</td>
                                <td th:text="${notification.titre}">Titre</td>
                                <td th:text="${notification.message}">Message</td>
                                <td th:text="${#temporals.format(notification.dateEnvoi, 'dd/MM/yyyy HH:mm')}">Date</td>
                                <td>
                                    <span th:if="${notification.lu}" class="badge bg-secondary">Lue</span>
                                    <span th:unless="${notification.lu}" class="badge bg-primary">Non lue</span>
                                </td>
                                <td>
                                    <div class="btn-group" role="group">
                                        <a th:href="@{/admin/notifications/edit/{id}(id=${notification.idNotification})}" 
                                           class="btn btn-sm btn-outline-warning" 
                                           title="Modifier">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <a th:href="@{/admin/notifications/delete/{id}(id=${notification.idNotification})}" 
                                           class="btn btn-sm btn-outline-danger" 
                                           title="Supprimer"
                                           onclick="return confirm('Êtes-vous sûr de vouloir supprimer cette notification ?');">
                                            <i class="bi bi-trash"></i>
                                        </a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="text-center my-4">
        <a href="/admin/dashboard" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> Retour au dashboard
        </a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (function() {
            const body = document.getElementById('adminNotifBody');
            if (!body) return;
            const rows = Array.from(body.children);
            const pageSize = document.getElementById('adminNotifPageSize');
            const filterInput = document.getElementById('adminNotifFilter');
            const etatSelect = document.getElementById('adminNotifEtat');
            const moreBtn = document.getElementById('adminNotifMore');
            const lessBtn = document.getElementById('adminNotifLess');
            const count = document.getElementById('adminNotifCount');

            let visible = parseInt(pageSize.value, 10);

            function matches(row) {
                const text = (row.dataset.adherent + ' ' + row.dataset.titre + ' ' + row.dataset.message).toLowerCase();
                const q = filterInput.value.trim().toLowerCase();
                const etat = etatSelect.value;
                const isLu = row.dataset.lu === 'true';
                const etatOk = etat === 'all' || (etat === 'lu' && isLu) || (etat === 'non_lue' && !isLu);
                const textOk = !q || text.includes(q);
                return etatOk && textOk;
            }

            function render() {
                const filtered = rows.filter(matches);
                const total = filtered.length;
                const maxVisible = Math.min(visible, total);
                let shown = 0;
                rows.forEach(row => {
                    if (matches(row) && shown < maxVisible) {
                        row.style.display = '';
                        shown++;
                    } else {
                        row.style.display = 'none';
                    }
                });
                count.textContent = `${maxVisible} / ${total}`;
                moreBtn.disabled = maxVisible >= total;
                lessBtn.disabled = maxVisible <= Math.min(5, total);
            }

            pageSize.addEventListener('change', () => {
                visible = parseInt(pageSize.value, 10);
                render();
            });
            filterInput.addEventListener('input', () => render());
            etatSelect.addEventListener('change', () => render());
            moreBtn.addEventListener('click', () => {
                visible = Math.min(rows.length, visible + 5);
                pageSize.value = '9999';
                render();
            });
            lessBtn.addEventListener('click', () => {
                visible = Math.max(5, visible - 5);
                if (visible < 9999) {
                    pageSize.value = String(visible);
                }
                render();
            });

            render();
        })();
    </script>
    </main>
</body>
</html>
