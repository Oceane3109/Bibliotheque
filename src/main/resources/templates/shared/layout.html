<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:replace="~{::title}">Bibliothèque</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}" />
    <link rel="stylesheet" th:href="@{/css/sidebar-theme.css}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
</head>
<body class="d-flex">
<nav class="sidebar" th:if="${#request.requestURI != null and #request.requestURI.startsWith('/admin')}">
    <div class="sidebar-header">Admin</div>
    <a href="/admin/dashboard"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
    <a href="/admin/livres/list"><i class="bi bi-book me-2"></i>Livres</a>
    <a href="/admin/adherents/list"><i class="bi bi-people me-2"></i>Adhérents</a>
    <a href="/admin/prets/list"><i class="bi bi-list-check me-2"></i>Prêts</a>
    <a href="/admin/reservations"><i class="bi bi-bookmark-check me-2"></i>Réservations</a>
    <a href="/admin/prolongements"><i class="bi bi-clock-history me-2"></i>Prolongements</a>
    <a href="/admin/penalites/list"><i class="bi bi-exclamation-triangle me-2"></i>Pénalités</a>
    <a href="/admin/notifications/list"><i class="bi bi-bell me-2"></i>Notifications</a>
    <form th:action="@{/logout}" method="post" style="display: inline;">
        <button type="submit" class="btn btn-link text-white text-start w-100" style="border: none; background: none; padding: 12px 20px;">
            <i class="bi bi-box-arrow-right me-2"></i>Déconnexion
        </button>
    </form>
</nav>
<nav class="sidebar" th:if="${#request.requestURI != null and #request.requestURI.startsWith('/adherent')}">
    <div class="sidebar-header">Adhérent</div>
    <a href="/adherent/dashboard"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
    <a href="/adherent/catalogue"><i class="bi bi-book me-2"></i>Catalogue</a>
    <a href="/adherent/mes-prets"><i class="bi bi-list-check me-2"></i>Mes prêts</a>
    <a href="/adherent/mes-reservations"><i class="bi bi-bookmark-check me-2"></i>Mes réservations</a>
    <a href="/adherent/mes-prolongements"><i class="bi bi-clock-history me-2"></i>Mes prolongements</a>
    <a href="/adherent/mes-notifications"><i class="bi bi-bell me-2"></i>Mes notifications</a>
    <a href="/adherent/statistiques"><i class="bi bi-bar-chart me-2"></i>Mes statistiques</a>
    <a href="/adherent/profile"><i class="bi bi-person me-2"></i>Mon profil</a>
    <form th:action="@{/logout}" method="post" style="display: inline;">
        <button type="submit" class="btn btn-link text-white text-start w-100" style="border: none; background: none; padding: 12px 20px;">
            <i class="bi bi-box-arrow-right me-2"></i>Déconnexion
        </button>
    </form>
</nav>
<main class="flex-fill p-4">
    <div layout:fragment="content"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
