<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="sidebar-admin">
        <nav class="sidebar">
            <div class="sidebar-header">Admin</div>
            <a href="/admin/dashboard"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
            <a href="/admin/livres/list"><i class="bi bi-book me-2"></i>Livres</a>

                <button type="submit" class="btn btn-link text-white text-start w-100" style="border: none; background: none; padding: 12px 20px;">
                    <i class="bi bi-box-arrow-right me-2"></i>Déconnexion
                </button>
            </form>
        </nav>
    </div>
    <div th:fragment="sidebar-adherent">

                <button type="submit" class="btn btn-link text-white text-start w-100" style="border: none; background: none; padding: 12px 20px;">
                    <i class="bi bi-box-arrow-right me-2"></i>Déconnexion
                </button>
